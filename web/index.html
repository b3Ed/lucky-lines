<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161f">
  <title>Lucky Lines</title>
  <script>
    try { var t = localStorage.getItem('lucky-lines-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="app.css?v=1">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="13" r="9" fill="var(--gold)"/><circle cx="21" cy="20" r="8" fill="var(--accent)"/><circle cx="12" cy="13" r="4" fill="var(--bg)" opacity=".9"/></svg>
      <span>Lucky Lines</span>
    </div>
    <button class="icon-btn" data-action="nav" data-to="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.9 4.6-.1-2.2-2.2-.6a6.9 6.9 0 0 0-.7-1.6l1.1-2-1.6-1.6-2 1.1c-.5-.3-1-.5-1.6-.7L13.2 3h-2.3l-.6 2.2c-.6.2-1.1.4-1.6.7l-2-1.1-1.6 1.6 1.1 2c-.3.5-.5 1-.7 1.6L3.1 10.9v2.2l2.2.6c.2.6.4 1.1.7 1.6l-1.1 2 1.6 1.6 2-1.1c.5.3 1 .5 1.6.7l.6 2.2h2.3l.6-2.2c.6-.2 1.1-.4 1.6-.7l2 1.1 1.6-1.6-1.1-2c.3-.5.5-1 .7-1.6l2.2-.6Z"/></svg>
    </button>
  </header>
  <main id="view" aria-live="polite"><div class="loading"><span></span><span></span><span></span></div></main>
  <nav class="tabs" aria-label="Main">
    <button data-action="nav" data-to="home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></button>
    <button data-action="nav" data-to="game" data-tab="game"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4"/><circle cx="16" cy="8" r="4"/><circle cx="8" cy="16" r="4"/><circle cx="16" cy="16" r="4"/></svg><span>Games</span></button>
    <button data-action="nav" data-to="lines" data-tab="lines"><svg viewBox="0 0 24 24"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2zM8 8h8M8 12h8"/></svg><span>My lines</span></button>
    <button data-action="nav" data-to="money" data-tab="money"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Money</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js?v=1"></script>
</body>
</html>
